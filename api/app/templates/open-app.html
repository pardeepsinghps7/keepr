<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta charset="UTF-8" />
    <script>
        function openApp() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const access_token = hashParams.get('access_token');
            const refresh_token = hashParams.get('refresh_token');
            const error = hashParams.get('error');
            const errorCode = hashParams.get('error_code');
            const errorDescription = hashParams.get('error_description');

            if (errorCode) {
                // Redirect to error page with query param
                window.location.href = `/error?error_code=${errorCode}&error_description=${errorDescription}`;
                return;
            }

            const fallbackUrl = "/success#"+window.location.hash.substring(1);
            const appLink = "keepr://app/auth-callback?action=confirm_signup&error="+error+"&error_code="+errorCode+"&error_description="+errorDescription+"&access_token="+access_token+"&refresh_token="+refresh_token;

            // Try opening the app
           // window.location = appLink;

            // Fallback if app doesn't open
            setTimeout(() => {
                window.location = fallbackUrl;
            }, 1500);
        }
    </script>
</head>
<body onload="openApp()">
<p>Opening app... If it doesn't open, you'll be redirected shortly.</p>
</body>
</html>
